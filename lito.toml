[package]
name = "liserveto"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["hypengw <hypengwip@gmail.com>"]

[lib]
name = "liserveto"
module = "liserveto"
archive = "liserveto"

[features.websocket]
default = false

[features.json]
default = false

[dependencies]
lihttpto = { version = "0.1.1", pub = true }
rstd-std = { version = "0.1.9", pub = true }
liwebsocketo = { version = "0.1.0", pub = true, condition = "feature.websocket" }
rstd-json = { version = "0.1.9", pub = true, condition = "feature.json" }

[dev-dependencies]
rstd-test = { version = "0.1.9" }
rstd-nostd = { version = "0.1.9", usage = "link" }

[[test]]
name = "liserveto-tests"
sources = ["tests/main.cpp", "tests/body.cpp", "tests/connection.cpp", "tests/server.cpp", "tests/response.cpp", "tests/websocket.cpp", "tests/transport.cpp", "tests/confined_dir.cpp", "tests/representation.cpp", "tests/file_response.cpp", "tests/static_files.cpp", "tests/endpoint.cpp", "tests/router.cpp", "tests/json.cpp", "tests/lifecycle.cpp", "tests/sse.cpp", "tests/websocket_endpoint.cpp"]
link-stdlib = false

[profile.base]
exceptions = false
rtti = false
